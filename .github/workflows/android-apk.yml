name: Arena APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Compiler l'application web
        run: npm run build

      - name: Créer le projet Android
        run: |
          npx cap add android
          node scripts/android-setup.mjs
          npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Arena-Game-Hub.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Arena-Game-Hub-apk
          path: Arena-Game-Hub.apk

      - name: Publier l'APK (dernière version)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Arena Game Hub - dernière version
          prerelease: true
          files: Arena-Game-Hub.apk
          body: "APK de test compilé automatiquement. Commit ${{ github.sha }}"
